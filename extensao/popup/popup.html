<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>CW Reputação</title>
    <style>
      :root {
        --roxo: #5b2a86;
        --violeta: #7b3fbf;
        --laranja: #f9a11b;
        --fundo: #ffffff;
        --superficie: #fafafa;
        --borda: #e4e4e7;
        --texto: #18181b;
        --fraco: #71717a;
        --perigo: #dc2626;
        --atencao: #b45309;
        --ok: #15803d;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --fundo: #17181c;
          --superficie: #1f2026;
          --borda: #303138;
          --texto: #ececf1;
          --fraco: #a1a1aa;
          --perigo: #f87171;
          --atencao: #fbbf24;
          --ok: #4ade80;
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        width: 360px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          Helvetica, Arial, sans-serif;
        font-size: 13px;
        line-height: 1.45;
        color: var(--texto);
        background: var(--fundo);
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        background: linear-gradient(135deg, var(--roxo), var(--violeta));
        color: #fff;
      }

      header svg { width: 22px; height: 22px; }
      header .titulo { font-weight: 600; }
      header .quem { font-size: 11px; opacity: .85; }
      header .espaco { flex: 1; }

      .icone-botao {
        border: none;
        background: rgba(255, 255, 255, .16);
        color: #fff;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
      }
      .icone-botao:hover { background: rgba(255, 255, 255, .28); }

      main { padding: 12px 14px 14px; }

      .rotulo {
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: .7px;
        text-transform: uppercase;
        color: var(--fraco);
        margin: 0 0 6px;
      }

      .bloco { margin-bottom: 14px; }

      .nota {
        display: flex;
        align-items: center;
        gap: 12px;
        border: 1px solid var(--borda);
        border-radius: 11px;
        padding: 11px 12px;
        background: var(--superficie);
      }

      .nota b {
        font-size: 27px;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .nota .faixa { font-weight: 600; }
      .nota .janela { font-size: 11px; color: var(--fraco); }

      .selo-ra {
        margin-left: auto;
        background: rgba(249, 161, 27, .18);
        color: #a16207;
        border-radius: 999px;
        padding: 3px 9px;
        font-size: 10.5px;
        font-weight: 700;
      }

      .numeros {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }

      .numero {
        border: 1px solid var(--borda);
        border-radius: 9px;
        padding: 7px 4px;
        text-align: center;
        background: var(--superficie);
      }

      .numero b { display: block; font-size: 16px; line-height: 1.1; }
      .numero span {
        font-size: 9.5px;
        color: var(--fraco);
        text-transform: uppercase;
      }

      .alerta {
        display: flex;
        gap: 8px;
        border: 1px solid var(--borda);
        border-radius: 9px;
        padding: 8px 10px;
        background: var(--superficie);
        cursor: pointer;
      }

      .alerta + .alerta { margin-top: 6px; }
      .alerta:hover { border-color: var(--violeta); }
      .alerta .tom { width: 3px; border-radius: 3px; flex: none; }
      .alerta.danger .tom { background: var(--perigo); }
      .alerta.warning .tom { background: var(--laranja); }
      .alerta.info .tom { background: var(--violeta); }
      .alerta .titulo { font-weight: 600; font-size: 12.5px; }
      .alerta .detalhe { font-size: 11.5px; color: var(--fraco); }

      .busca { display: flex; gap: 6px; }

      .busca input {
        flex: 1;
        min-width: 0;
        padding: 7px 10px;
        border: 1px solid var(--borda);
        border-radius: 8px;
        background: var(--fundo);
        color: var(--texto);
        font-size: 12.5px;
        font-family: inherit;
      }

      .busca button, .acao {
        border: none;
        border-radius: 8px;
        padding: 7px 13px;
        background: var(--roxo);
        color: #fff;
        font-size: 12.5px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }

      .resultado {
        margin-top: 8px;
        border: 1px solid var(--borda);
        border-radius: 9px;
        padding: 9px 10px;
        background: var(--superficie);
      }

      .caso {
        display: block;
        border-top: 1px solid var(--borda);
        padding: 7px 0 0;
        margin-top: 7px;
        cursor: pointer;
      }

      .caso:hover .titulo-caso { color: var(--violeta); }
      .titulo-caso { font-size: 12px; font-weight: 600; }
      .sub { font-size: 11px; color: var(--fraco); }

      .estado {
        text-align: center;
        padding: 22px 10px;
        color: var(--fraco);
        font-size: 12.5px;
      }

      .estado b {
        display: block;
        color: var(--texto);
        margin-bottom: 4px;
      }

      footer {
        border-top: 1px solid var(--borda);
        padding: 9px 14px;
        display: flex;
        justify-content: space-between;
        background: var(--superficie);
        font-size: 11.5px;
      }

      footer a {
        color: var(--violeta);
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
      }
    </style>
  </head>

  <body>
    <header>
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="2.5" y="2.5" width="19" height="19" rx="5.5"
              stroke="currentColor" stroke-width="2" />
        <circle cx="12" cy="10.8" r="3.5" fill="#F9A11B" />
        <path d="M7.4 16.5c1.2 1.3 2.8 2 4.6 2s3.4-.7 4.6-2"
              stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" />
      </svg>

      <span>
        <span class="titulo">CW Reputação</span><br />
        <span class="quem" id="quem">carregando…</span>
      </span>

      <span class="espaco"></span>

      <button class="icone-botao" id="atualizar"
              title="Atualizar" type="button">&#8635;</button>
    </header>

    <main id="conteudo">
      <div class="estado">Consultando…</div>
    </main>

    <footer>
      <a id="abrir-app">Abrir aplicação</a>
      <a id="abrir-opcoes">Opções</a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
